name: "Check"

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:

      - name: "Setup Python"
        uses: "actions/setup-python@v5"
        with:
          python-version: 3.11.9

      - name: "Checkout code"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          ref: ${{ github.event.pull_request.head.sha }}

      - name: "Check packs format"
        run: |
          make check

      - name: "Checkout firmware"
        uses: actions/checkout@v4
        with:
          repository: Next-Flip/Momentum-Firmware
          fetch-depth: 1
          ref: dev
          path: .firmware

      - name: "Regenerate icons.txt"
        run: |
          cd .firmware/assets/icons
          for icon in */*.png */*/frame_rate; do echo "$icon"; done | LC_COLLATE=C sort -fs > ../../../.utils/icons.txt
          cd ../../..
          rm -rf .firmware

      - name: "Prepare deterministic diff"
        run: |
          gunzip --keep -- */download/*.tar.gz
          git rm -- */download/*.tar.gz
          git add -- */download/*.tar

      - name: "Repack everything"
        run: |
          make repack

      - name: "Upload artifacts to GitHub"
        uses: actions/upload-artifact@v4
        with:
          include-hidden-files: true
          path: |
            */download
            .utils/icons.txt

      - name: "Check deterministic diff"
        run: |
          gunzip -- */download/*.tar.gz
          git add --intent-to-add -- */download/*.tar
          git diff --exit-code -- */download/*.tar .utils/icons.txt

      - name: "Configure for Reindex"
        run: |
          if ${{ secrets.INDEXER_URL == '' }} ; then
            exit
          fi
          if ${{ github.event_name == 'push' }} ; then
            if ${{ github.ref_name == 'dev' }} ; then
              SHOULD_REINDEX=true
            fi
          fi
          echo "SHOULD_REINDEX=$SHOULD_REINDEX" >> $GITHUB_ENV

      - name: "Trigger reindex"
        if: ${{ env.SHOULD_REINDEX == 'true' }}
        run: |
          curl --fail -L -H "Token: ${{ secrets.INDEXER_TOKEN }}" \
              "${{ secrets.INDEXER_URL }}"/asset-packs/reindex;

      - name: "Force deploy website to refresh asset packs"
        if: ${{ env.SHOULD_REINDEX == 'true' }}
        uses: Codex-/return-dispatch@v2
        id: force-deploy
        with:
          token: ${{ secrets.REPO_DISPATCH_TOKEN }}
          ref: dev
          repo: v2.momentum-fw.dev
          owner: Next-Flip
          workflow: force-deploy.yml
          workflow_timeout_seconds: 300
          workflow_job_steps_retry_seconds: 5

      - name: "Wait for deploy (Run ID ${{ steps.force-deploy.outputs.run_id }})"
        if: ${{ env.SHOULD_REINDEX == 'true' }}
        uses: Codex-/await-remote-run@v1
        with:
          token: ${{ github.token }}
          repo: v2.momentum-fw.dev
          owner: Next-Flip
          run_id: ${{ steps.force-deploy.outputs.run_id }}
          run_timeout_seconds: 300
          poll_interval_ms: 5000